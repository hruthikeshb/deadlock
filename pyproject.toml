[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "deadlock-monsoon"
version = "0.1.0"
description = "Physics-aware regional atmospheric forecasting for Multiverse of Monsoon"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.100",
  "numpy>=1.26",
  "torch>=2.1",
  "uvicorn>=0.23",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "psutil>=5.9", "ruff>=0.6"]
train = ["xarray>=2023.1", "netCDF4>=1.6"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

